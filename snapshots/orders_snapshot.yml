snapshots:
  - name: orders_snapshot
    relation: source('jaffle_shop', 'orders')
    description:  A snapshot of the orders table in the jaffle_shop source.
    config:
      database: DBT_SANDBOX
      strategy: check
      unique_key: id
      check_cols: ['id','user_id','status','order_date']
      hard_deletes: ignore